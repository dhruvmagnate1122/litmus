name: False positive / false negative
description: Improve a detector or adjudication rule
title: "[signal] "
labels: ["bug"]
body:
  - type: dropdown
    id: direction
    attributes:
      label: Signal problem
      options:
        - False positive
        - False negative
        - Wrong severity
        - Wrong evidence/status resolution
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: SEC-CORS
    validations:
      required: true
  - type: textarea
    id: minimal
    attributes:
      label: Minimal sanitized example
      description: Explain why the current result is wrong. Do not paste secrets.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Better evidence or expected adjudication
